<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人生不能重來 RPG - 傳奇冒險系統 V7.0 Stable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #020617; 
            font-family: 'Noto Sans TC', sans-serif; 
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; 
        }
        
        canvas { display: block; cursor: move; }

        .glass-panel {
            background: rgba(10, 15, 32, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 2px solid rgba(99, 102, 241, 0.3);
            z-index: 20;
        }

        .pixel-title-main {
            font-size: clamp(2rem, 8vw, 3.5rem); 
            font-weight: 950;
            background: linear-gradient(to bottom, #fbbf24, #d97706);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.6));
            letter-spacing: -2px; font-style: italic;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }

        .rank-badge {
            display: inline-block;
            white-space: nowrap; 
            padding: 2px 10px;
            font-size: 10px;
            font-weight: 900;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .rank-bronze { background: #78350f; color: #fde68a; }
        .rank-silver { background: #334155; color: #f1f5f9; }
        .rank-gold { background: #b45309; color: #fff; box-shadow: 0 0 10px #fbbf24; }
        .rank-legendary { background: #be123c; color: #fff; animation: glow-pulse 1s infinite alternate; }

        @keyframes glow-pulse { from { box-shadow: 0 0 4px #f43f5e; } to { box-shadow: 0 0 12px #f43f5e; } }
        
        .start-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            box-shadow: 0 0 30px rgba(79, 70, 229, 0.4);
        }
        
        .press-start { animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* 針對平板優化按鈕點擊範圍 */
        .touch-target { min-height: 44px; min-width: 44px; }

        .shake-effect { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } }
    </style>
</head>
<body>

    <div id="title-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-950 transition-opacity duration-700">
        <h1 class="pixel-title-main mb-4">人生不能重來 RPG</h1>
        <p class="text-indigo-400 font-bold tracking-[0.4em] mb-14 uppercase opacity-80 text-center px-4">Legendary Adventure Engine V7.0</p>
        <button onclick="startGame()" class="start-btn group px-16 py-8 rounded-[2rem] transition-all active:scale-95">
            <span class="text-2xl font-black text-white press-start">ENTER WORLD</span>
        </button>
    </div>

    <div id="ui-layer" class="hidden fixed inset-0 z-10 pointer-events-none flex">
        <div id="sidebar" class="w-72 md:w-80 h-full glass-panel pointer-events-auto flex flex-col p-5 shadow-2xl">
            <header class="mb-6">
                <h2 class="text-indigo-400 font-black text-xl italic tracking-tighter flex items-center gap-2">🛡️ HEROES GUILD</h2>
                <div class="h-1 w-16 bg-indigo-500 mt-1 rounded-full"></div>
            </header>

            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">戰區據點</label>
                    <div class="flex gap-2 mt-1">
                        <select id="classSelector" onchange="switchClass(this.value)" class="flex-grow bg-slate-950 border-2 border-slate-800 text-white rounded-xl p-3 text-sm focus:outline-none">
                            </select>
                        <button onclick="promptAddClass()" class="bg-indigo-600 px-4 py-2 rounded-xl text-white font-bold touch-target">＋</button>
                    </div>
                </div>
                <button onclick="editClassList()" class="w-full bg-slate-800/60 py-4 text-xs font-black border border-slate-700 rounded-2xl flex items-center justify-center gap-2">
                    ⚔️ 編輯英雄名單
                </button>
                <input type="text" id="studentSearch" oninput="renderStudentList()" placeholder="搜尋..." 
                    class="w-full bg-slate-950 border-2 border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500">
            </div>

            <div class="flex-grow overflow-y-auto custom-scrollbar pr-1 space-y-3" id="studentListUI"></div>

            <footer class="mt-4 pt-4 border-t border-slate-800 flex gap-2">
                <button onclick="exportData()" class="flex-grow bg-emerald-700 py-3 text-[10px] font-black rounded-xl">匯出戰報</button>
                <button onclick="confirmDeleteClass()" class="bg-rose-950/80 px-4 py-3 text-xs rounded-xl border border-rose-900">🗑️</button>
            </footer>
        </div>

        <div id="level-up-overlay" class="flex-grow flex items-center justify-center pointer-events-none">
            <div id="notice-box" class="opacity-0 scale-50 transition-all duration-500 bg-slate-900/98 border-y-4 border-yellow-500 px-10 py-8 text-center shadow-2xl rounded-3xl">
                <h3 class="text-yellow-400 text-4xl font-black italic mb-2">EVOLUTION!</h3>
                <p id="notice-text" class="text-xl text-white font-bold"></p>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-black/90 backdrop-blur-md p-6">
        <div class="bg-slate-900 w-full max-w-md p-8 border border-slate-700 rounded-[2rem] shadow-2xl">
            <h3 id="modalTitle" class="text-2xl font-black text-indigo-400 mb-2 italic"></h3>
            <p id="modalText" class="text-slate-400 text-sm mb-6"></p>
            <div id="modalInputArea" class="hidden mb-6">
                <input type="text" id="modalInput" class="w-full bg-slate-950 border-2 border-slate-800 rounded-xl px-4 py-3 text-white outline-none">
            </div>
            <div id="modalTextareaArea" class="hidden mb-6">
                <textarea id="modalTextarea" rows="8" class="w-full bg-slate-950 border-2 border-slate-800 rounded-xl px-4 py-3 text-sm text-white outline-none custom-scrollbar"></textarea>
            </div>
            <div class="flex justify-end gap-4">
                <button onclick="closeModal()" class="px-6 py-3 text-sm font-bold text-slate-500">CANCEL</button>
                <button id="modalConfirmBtn" class="px-8 py-3 bg-indigo-600 rounded-xl text-sm font-black text-white">CONFIRM</button>
            </div>
        </div>
    </div>

    <script>
        // --- 音效引擎 ---
        const SoundFX = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freq, type, duration, vol = 0.05) {
                try {
                    this.init(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            click() { this.play(800, 'sine', 0.1); },
            coin() { this.play(1000, 'triangle', 0.2); },
            levelUp() { this.play(600, 'square', 0.4); }
        };

        // --- 核心變數 ---
        let scene, camera, renderer, raycaster, mouse;
        let charMeshes = {}, labelSprites = {}, particles = [];
        let students = [], currentClass = "冒險組 A", availableClasses = ["冒險組 A"];
        let localDataStore = { "冒險組 A": [] };

        // --- 觸控邏輯優化 ---
        let isPointerDown = false;
        let lastPointerX = 0, lastPointerY = 0;
        let cameraBaseX = 0, cameraBaseY = 0, cameraBaseZ = 200;
        let isMovingCamera = false;

        // --- 初始化資料 (確保平板關閉後資料還在) ---
        function initData() {
            const savedClasses = localStorage.getItem('rpg_classes');
            const savedData = localStorage.getItem('rpg_data');
            const savedLast = localStorage.getItem('rpg_last_class');

            if (savedClasses) availableClasses = JSON.parse(savedClasses);
            if (savedData) localDataStore = JSON.parse(savedData);
            if (savedLast && availableClasses.includes(savedLast)) currentClass = savedLast;
            
            updateClassSelector();
        }

        function saveData() {
            localStorage.setItem('rpg_classes', JSON.stringify(availableClasses));
            localStorage.setItem('rpg_data', JSON.stringify(localDataStore));
            localStorage.setItem('rpg_last_class', currentClass);
        }

        function updateClassSelector() {
            const sel = document.getElementById('classSelector');
            sel.innerHTML = '';
            availableClasses.forEach(c => {
                const opt = document.createElement('option');
                opt.value = opt.innerText = c;
                if (c === currentClass) opt.selected = true;
                sel.appendChild(opt);
            });
        }

        // --- 遊戲引擎啟動 ---
        window.startGame = () => {
            SoundFX.click();
            document.getElementById('title-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('title-screen').remove();
                document.getElementById('ui-layer').classList.remove('hidden');
                initData();
                init3D();
                switchClass(currentClass);
                animate();
            }, 500);
        };

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制 PixelRatio 防止平板過熱
            
            raycaster = new THREE.Raycaster(); mouse = new THREE.Vector2();
            scene.add(new THREE.AmbientLight(0xffffff, 1.5));

            // 背景星空
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<3000; i++) starPos.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x6366f1, size: 1.5 }));
            scene.add(stars);

            window.addEventListener('resize', onWindowResize);
            const canvas = renderer.domElement;
            canvas.addEventListener('pointerdown', e => { isPointerDown = true; lastPointerX = e.clientX; lastPointerY = e.clientY; isMovingCamera = false; });
            canvas.addEventListener('pointermove', e => {
                if (!isPointerDown) return;
                const dx = e.clientX - lastPointerX; const dy = e.clientY - lastPointerY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    isMovingCamera = true;
                    cameraBaseX -= dx * (camera.position.z / 1000);
                    cameraBaseY += dy * (camera.position.z / 1000);
                }
                lastPointerX = e.clientX; lastPointerY = e.clientY;
            });
            canvas.addEventListener('pointerup', e => {
                if (!isMovingCamera) handleCanvasClick(e);
                isPointerDown = false;
            });
        }

        function handleCanvasClick(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Object.values(charMeshes));
            if (intersects.length > 0) {
                const id = intersects[0].object.userData.id;
                changePoints(id, 1);
            }
        }

        window.switchClass = (name) => {
            currentClass = name;
            students = localDataStore[name] || [];
            
            // 清理舊物件
            Object.values(charMeshes).forEach(m => scene.remove(m));
            Object.values(labelSprites).forEach(m => scene.remove(m));
            charMeshes = {}; labelSprites = {};
            
            renderStudentList();
            sync3D(true); // 強制重新定位相機
            saveData();
        };

        const ROLES = {
            warrior: { title: '戰士', color: '#ef4444' },
            mage: { title: '法師', color: '#8b5cf6' },
            assassin: { title: '刺客', color: '#10b981' }
        };

        function getRank(lv) {
            if (lv >= 20) return { title: '傳說英雄', badge: 'rank-legendary' };
            if (lv >= 10) return { title: '金牌冒險者', badge: 'rank-gold' };
            if (lv >= 5) return { title: '資深隊員', badge: 'rank-silver' };
            return { title: '初心者', badge: 'rank-bronze' };
        }

        // --- 3D 物件生成 ---
        function createCharTexture(s) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const color = ROLES[s.role]?.color || '#fff';
            
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(128, 160, 60, 0, Math.PI*2); ctx.fill(); // 身體
            ctx.fillStyle = '#ffdbac';
            ctx.beginPath(); ctx.arc(1
